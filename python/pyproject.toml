[project]
name = "teldra-python-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["teldra-ifc"]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.10",
]

[tool.uv]
package = false

[tool.uv.sources]
teldra-ifc = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
