name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check generated schema contracts
        run: pnpm schema:check

      - name: Enforce architecture boundaries
        run: pnpm architecture:check

      - name: Enforce quality policy
        run: pnpm quality:check

      - name: Enforce release policy
        run: pnpm release:check

      - name: Enforce toolchain and provenance policy
        run: pnpm toolchain:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify site build
        run: pnpm --filter @teldra/site verify

      - name: Build Studio application
        run: pnpm --filter @teldra/studio build

      - name: Test
        run: pnpm test

      - name: Build Storybooks
        run: pnpm storybook:build

      - name: Install Chromium
        run: pnpm --filter @teldra/studio exec playwright install --with-deps chromium

      - name: Test Storybooks
        run: pnpm storybook:test

      - name: Validate JSON syntax
        run: |
          python -m json.tool schemas/json/twin.schema.json >/dev/null
          python -m json.tool schemas/json/project.schema.json >/dev/null
          python -m json.tool schemas/json/scene.schema.json >/dev/null
          python -m json.tool schemas/json/appearance.schema.json >/dev/null
          python -m json.tool schemas/json/lighting.schema.json >/dev/null
          python -m json.tool schemas/json/live.schema.json >/dev/null
          python -m json.tool schemas/json/artifact-provenance.schema.json >/dev/null
          python -m json.tool schemas/json/diagnostic-event.schema.json >/dev/null
          python -m json.tool schemas/json/support-bundle.schema.json >/dev/null
          python -m json.tool quality/budgets.json >/dev/null
          python -m json.tool release/policy.json >/dev/null
          python -m json.tool toolchain/manifest.json >/dev/null
          python -m json.tool fixtures/provenance/web-export.json >/dev/null
          python -m json.tool fixtures/corpus.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/project.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/identity-map.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/twin.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/scene.manifest.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/appearance.manifest.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/lighting.manifest.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/live/light-observation.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/live/opening-observation.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/live/environment-observation.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/live/media-observation.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/live/desired-light.json >/dev/null

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.12

      - name: Resolve workspace
        run: uv sync --group dev

      - name: Check deterministic golden fixture
        run: uv run python ../tools/fixtures/generate_golden_home.py --check

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
