name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check generated schema contracts
        run: pnpm schema:check

      - name: Enforce architecture boundaries
        run: pnpm architecture:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build Storybooks
        run: pnpm storybook:build

      - name: Install Chromium
        run: pnpm --filter @teldra/studio exec playwright install --with-deps chromium

      - name: Test Storybooks
        run: pnpm storybook:test

      - name: Validate JSON syntax
        run: |
          python -m json.tool schemas/json/twin.schema.json >/dev/null
          python -m json.tool schemas/json/project.schema.json >/dev/null
          python -m json.tool schemas/json/scene.schema.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/twin.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/scene.manifest.json >/dev/null

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: false

      - name: Install Python
        run: uv python install 3.12

      - name: Resolve workspace
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
