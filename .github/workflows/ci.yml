name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.8.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Enforce architecture boundaries
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate JSON syntax
        run: |
          python -m json.tool schemas/json/twin.schema.json >/dev/null
          python -m json.tool schemas/json/project.schema.json >/dev/null
          python -m json.tool fixtures/projects/golden-home/twin.json >/dev/null
